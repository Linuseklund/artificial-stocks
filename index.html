<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sobriety support, based on the twelve-step programme." />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores SVG touch icons and falls back to a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Translucent, so the page's own background paints behind the status bar
         and follows light and dark mode instead of a fixed bar colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sober" />
    <!-- Link previews. og:image must be absolute — iMessage, Slack and
         WhatsApp all ignore a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sober" />
    <meta property="og:title" content="Sober – day by day" />
    <meta property="og:description" content="Sobriety support built on the twelve-step programme. A counter, a button for when the craving hits, a calm voice, and the twelve steps. Nothing leaves your device." />
    <meta property="og:url" content="https://linuseklund.github.io/artificial-stocks/" />
    <meta property="og:image" content="https://linuseklund.github.io/artificial-stocks/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sober – day by day" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sober – day by day" />
    <meta name="twitter:description" content="Sobriety support built on the twelve-step programme. Nothing leaves your device." />
    <meta name="twitter:image" content="https://linuseklund.github.io/artificial-stocks/share-card.png" />
    <title>Sober – day by day</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
